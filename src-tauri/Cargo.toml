[package]
name = "syncdrop"
version = "2.0.0"
description = "Send files straight between your own devices"
authors = ["pachisiav11"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "syncdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# Blocking HTTP is fine here: naming runs on Tauri's async command pool, and the
# only endpoint is a model on this machine.
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "bmp",
  "tiff",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
